# Application Configuration
spring.application.name=QuanLyBanHang

# Server
server.port=8080

# Avatar upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.avatar.storage-path=${APP_AVATAR_STORAGE_PATH:./data/avatars}

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/quanlybanhang?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
# Enable behind an HTTPS reverse proxy if request.isSecure() is not forwarded.
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}

# CORS - cho phep frontend truy cap
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500

# Mail (cau hinh qua bien moi truong, khong luu thong tin Gmail trong source)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Reset Password
app.reset-password.token-expiration-ms=1800000
app.reset-password.frontend-url=http://localhost:5500/reset-password
app.login.frontend-url=http://localhost:5500/login

# Tai khoan quan tri ban dau; giu nguyen tai khoan da co.
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}

# Du lieu demo chi duoc tao khi bat tuong minh; mat khau khong co gia tri mac dinh.
app.seed-demo-users=${APP_SEED_DEMO_USERS:false}
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
app.demo-user.password=${APP_DEMO_USER_PASSWORD:}
