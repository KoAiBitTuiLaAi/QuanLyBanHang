<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Đăng nhập hệ thống quản lý bán hàng và kho."
    />
    <title>Đăng nhập | Quản lý bán hàng & kho</title>
    <link rel="icon" href="/assets/brand-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/toast.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="brand-panel" aria-labelledby="brand-title">
        <div class="brand-heading">
          <a class="brand" href="/" aria-label="Trang đăng nhập">
            <span class="brand-mark" aria-hidden="true">
              <img src="/assets/brand-mark.svg" alt="" />
            </span>
            <span class="brand-name">SaleStock</span>
          </a>

          <div class="brand-copy">
            <h1 id="brand-title">Quản lý bán hàng và kho</h1>
            <p class="brand-description">Đăng nhập để làm việc với hàng hóa, kho và tài khoản nhân sự.</p>
          </div>
        </div>

      </section>

      <section class="form-panel" aria-labelledby="login-title">
        <div class="form-wrap">
          <div class="mobile-brand">
            <img src="/assets/brand-mark.svg" alt="" />
            <span>SaleStock</span>
          </div>

          <header class="form-header">
            <h2 id="login-title">Đăng nhập hệ thống</h2>
            <span>Sử dụng tài khoản được cấp để tiếp tục làm việc.</span>
          </header>

          <form class="login-form" id="login-form" autocomplete="on" novalidate>
            <div class="field-group">
              <label for="username">Tên đăng nhập</label>
              <div class="field-control">
                <span class="field-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" />
                  </svg>
                </span>
                <input
                  id="username"
                  name="username"
                  type="text"
                  placeholder="Nhập tên đăng nhập"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <div class="field-group">
              <label for="password">Mật khẩu</label>
              <div class="field-control">
                <span class="field-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="4" y="10" width="16" height="11" rx="2" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
                  </svg>
                </span>
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Nhập mật khẩu"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  aria-label="Hiện mật khẩu"
                  aria-pressed="false"
                  data-password-toggle
                >
                  <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m3 3 18 18M10.6 6.1A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.4 3M6.6 6.7A15.3 15.3 0 0 0 2.5 12s3.5 6 9.5 6a9.8 9.8 0 0 0 3.2-.5M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-options">
              <label class="remember-option" for="remember">
                <input id="remember" name="remember" type="checkbox" />
                <span class="checkbox-ui" aria-hidden="true">
                  <svg viewBox="0 0 16 16"><path d="m3.5 8.2 2.7 2.7 6.3-6.3" /></svg>
                </span>
                <span>Ghi nhớ đăng nhập</span>
              </label>
              <a class="account-help" href="/forgot-password">Quên mật khẩu?</a>
            </div>

            <button class="submit-button" type="submit">
              <span>Đăng nhập</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M14 7l5 5-5 5" />
              </svg>
            </button>
          </form>

          <footer class="form-footer">
            <span class="secure-dot"></span>
            Liên hệ quản trị viên nếu bạn chưa được cấp tài khoản.
          </footer>
        </div>
      </section>
    </main>

    <script src="/js/toast.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
