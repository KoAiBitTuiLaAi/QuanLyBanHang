<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lại mật khẩu | SaleStock</title><link rel="stylesheet" href="/css/auth-pages.css"><link rel="stylesheet" href="/css/toast.css"></head>
<body><main class="auth-card"><a class="auth-brand" href="/login"><img src="/assets/brand-mark.svg" alt=""><span>SaleStock</span></a><h1>Đặt mật khẩu mới</h1><p class="lead">Mật khẩu cần ít nhất 8 ký tự, gồm cả chữ và số. Liên kết chỉ dùng được một lần.</p>
<form id="reset-form" novalidate><label for="new-password">Mật khẩu mới</label><input id="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="100"><label for="confirm-password">Nhập lại mật khẩu</label><input id="confirm-password" type="password" autocomplete="new-password" required><button type="submit">Lưu mật khẩu mới</button></form><a class="back-link" href="/login">Quay lại đăng nhập</a></main><script src="/js/toast.js"></script><script src="/js/password-reset.js"></script></body></html>
